service: dashboard

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  # AWS credentials profile in ~/.aws/credentials (the account that owns stack dashboard-dev).
  # Override with: serverless deploy --aws-profile <name>
  profile: dhruva-deploy
  memorySize: 1024
  # API Gateway HTTP API max integration timeout is 30s; use 29 to avoid 504
  timeout: 29
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_URL: ${env:DB_URL, 'mongodb+srv://naveengccursor_db_user:JvalSatQuJ1kcDrv@dashboarddhruva.h5rq6qe.mongodb.net/?appName=dashboarddhruva'}
    JWT_SECRET: ${env:JWT_SECRET, 'your-temporary-secret-change-this-in-production'}
    # Everyday Expenses bills (private bucket defined under resources)
    BILLS_BUCKET: ${self:custom.billsBucket}
    BILLS_BUCKET_REGION: ${self:provider.region}

  # API role may only touch the Everyday Expenses prefix of the bills bucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.billsBucket}/everyday-expenses/*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.billsBucket}
          Condition:
            StringLike:
              s3:prefix: everyday-expenses/*

  httpApi:
    cors:
      allowedOrigins: '*'
      allowedHeaders: '*'
      allowedMethods: '*'

functions:
  # Main API - all Express routes handled by single Lambda
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

custom:
  # Globally unique, per stage and account. Private; accessed only through signed URLs.
  billsBucket: ${self:service}-${sls:stage}-expense-bills-${aws:accountId}

plugins:
  - serverless-offline

resources:
  Resources:
    BillsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.billsBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT, GET]
              AllowedOrigins: ['*']
              AllowedHeaders: ['Content-Type']
              MaxAge: 3000
    BillsBucketTlsOnly:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BillsBucket
        PolicyDocument:
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - arn:aws:s3:::${self:custom.billsBucket}
                - arn:aws:s3:::${self:custom.billsBucket}/*
              Condition:
                Bool:
                  aws:SecureTransport: 'false'

package:
  individually: true
  patterns:
    - '!assets/**'
    - '!*.xlsx'
    - '!*.md'
    - '!PAYLOAD_EXAMPLES.md'
